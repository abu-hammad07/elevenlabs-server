<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Bot Chatbox</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* Chat toggle button */
        #chat-toggle {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: #4A73FF;
            color: white;
            padding: 12px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Chat iframe box */
        #chat-box {
            position: fixed;
            bottom: 90px;
            right: 25px;
            width: 380px;
            height: 550px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            display: none; /* Hidden by default */
            box-shadow: 0 5px 20px rgba(0,0,0,0.25);
            z-index: 9999;
        }

        #chat-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <!-- Chat Toggle Button -->
    <div id="chat-toggle">💬 Voice Bot</div>

    <!-- Chat Box Iframe -->
    <div id="chat-box">
        <iframe 
            src="https://botifire-ai-voicebot.lovable.app/"
            allow="microphone; clipboard-read; clipboard-write"
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const toggle = document.getElementById("chat-toggle");
        const chatbox = document.getElementById("chat-box");

        toggle.addEventListener("click", () => {
            if (chatbox.style.display === "none") {
                chatbox.style.display = "block";
            } else {
                chatbox.style.display = "none";
            }
        });
    </script>

</body>
</html>
